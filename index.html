<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>JippeCraft</title>
  <meta name="description" content="Een bouwspel met blokken voor kinderen, speelbaar op de iPad.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JippeCraft">
  <meta name="theme-color" content="#5fbf45">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    // Start het spel niet (te oude browser)? Laat dan een duidelijke melding zien.
    setTimeout(function () {
      if (!window.__jippecraft && !document.querySelector('.error')) {
        document.getElementById('app').innerHTML = '<div class="error"><h1>Oeps!</h1>' +
          '<p>Deze iPad is te oud voor JippeCraft. Werk de iPad bij via Instellingen &rarr; Algemeen &rarr; Software-update.</p></div>';
      }
    }, 12000);
  </script>
</body>
</html>
