# Automatische controle van JippeCraft: lint, unit-tests en de browsertests in een
# nagebootste iPad. Draait bij elke pull request en bij elke push naar de speelbranch.
name: Tests

on:
  pull_request:
  push:
    branches: [claude/compassionate-dirac-pkrfgp]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:browser
      # Schermafbeeldingen van de test, handig als er iets misgaat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermafbeeldingen
          path: tests/out/
          retention-days: 7
